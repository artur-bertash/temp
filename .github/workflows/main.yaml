name: ""

on:
    push: 
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - id: version 
              run: echo "1.0.0" >> "$GITHUB_OUTPUT"
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Saying hello world!
              run: echo "hello world!"

    demo:

        runs-on: ubuntu-latest
        steps:
          - run: echo "::warning file=README.md,line=1,title=Heads up::This file needs attention"

            
